name: Engine Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run verification
        run: |
          python3 -m py_compile runner/*.py examples/*.py
          python3 examples/sample_tasks.py
